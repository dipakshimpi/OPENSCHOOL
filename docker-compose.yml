services:
  # --- DATABASE (For PeerTube) ---
  postgres:
    image: postgres:13-alpine
    env_file: ./peertube/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # --- CACHE (For PeerTube) ---
  redis:
    image: redis:6-alpine
    volumes:
      - redisdata:/data
    restart: always

  # --- VIDEO ENGINE (PeerTube) ---
  peertube:
    image: chocobozzz/peertube:production-bookworm
    env_file: ./peertube/.env
    ports:
      - "9001:9000"
    volumes:
      - ./peertube/data:/data
      - ./peertube/config:/config
    depends_on:
      - postgres
      - redis
    restart: always

  # --- THE WEB APP (Next.js) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        # THIS IS FOR THE BROWSER (Windows)
        - NEXT_PUBLIC_PEERTUBE_URL=http://localhost:9001
    ports:
      - "3000:3000"
    environment:
      # THIS IS FOR THE SERVER (Inside Docker)
      - PEERTUBE_API_URL=http://peertube:9000
    env_file:
      - .env
    depends_on:
      - peertube
    restart: always

volumes:
  pgdata:
  redisdata:
