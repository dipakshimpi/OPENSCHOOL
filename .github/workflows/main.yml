name: openschool ci pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# This grants the workflow permission to write to the GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # This tells GitHub to do everything inside the 'web' folder
    defaults:
      run:
        working-directory: ./web

    steps:
      # 1. Copy your code from GitHub to the Runner
      - name: checkout Repository
        uses: actions/checkout@v4

      # 2. Setup the "Engine" (Node.js)
      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      # 3. Install dependencies
      - name: install dependencies
        run: npm ci

      # 4. SECURITY CHECK (New)
      # Checks if your npm packages are safe.
      # It only fails if there is a 'High' or 'Critical' vulnerability.
      - name: Security audit
        run: npm audit --audit-level=high

      # 5. STYLE CHECK
      - name: run linter
        run: npm run lint

      # 6. PERFORMANCE CACHE (New)
      # This "remembers" your previous Next.js builds.
      # It makes your "npm run build" step MUCH faster over time.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ./web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # 7. THE COMPILATION
      - name: run build
        run: npm run build

      # 8. SAVE THE RESULT (New)
      # This takes the output of the build (.next folder) and saves it
      # on GitHub so you can download it and inspect it.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: ./web/.next
          retention-days: 7
