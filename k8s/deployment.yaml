apiVersion: apps/v1
kind: Deployment
metadata:
  name: openschool-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openschool-web
  template:
    metadata:
      labels:
        app: openschool-web
    spec:
      containers:
      - name: web
        image: ghcr.io/dipakshimpi/openschool/web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: openschool-secrets